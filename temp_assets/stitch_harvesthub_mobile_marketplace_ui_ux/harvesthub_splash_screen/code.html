<script>
  (function() {
    const bar = document.getElementById('splash-progress');
    if (!bar) return;
    let progress = 30;
    const interval = setInterval(() => {
      progress += (100 - progress) * 0.18;
      if (progress >= 98) {
        bar.style.width = '100%';
        clearInterval(interval);
      } else {
        bar.style.width = progress + '%';
      }
    }, 180);
  })();
